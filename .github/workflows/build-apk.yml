name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Compilar con Buildozer (imagen oficial)
        run: |
          docker run --rm -v "$PWD":/home/user/hostcwd kivy/buildozer android debug

      - name: Subir el APK como archivo descargable
        uses: actions/upload-artifact@v4
        with:
          name: joi-apk
          path: bin/*.apk
